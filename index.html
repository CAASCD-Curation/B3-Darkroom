<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>暗房 DARKROOM — VISUAL RESEARCH DATABASE</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<!-- ============ 顶部：MEDIA 一级筛选 ============ -->
<header id="topbar">
  <div class="brand">
    <h1>暗房 <span class="en">DARKROOM</span></h1>
    <span class="sub">VISUAL RESEARCH DATABASE · V2</span>
  </div>
  <nav id="mediaBar" aria-label="MEDIA 筛选"></nav>
  <div class="counter" id="counter">—</div>
</header>

<div id="layout">
  <!-- ============ 左侧：DARKROOM AS ? 二级筛选 ============ -->
  <aside id="sidebar" aria-label="DARKROOM AS 筛选">
    <div class="side-title">DARKROOM<br>AS&nbsp;?</div>
    <nav id="asBar"></nav>
  </aside>

  <!-- ============ 中央：IMAGE WALL ============ -->
  <main id="wall" aria-label="照片墙"></main>
</div>

<!-- ============ 详情态：显影 ============ -->
<div id="detail" hidden role="dialog" aria-modal="true">
  <div class="detail-body">
    <figure class="detail-image">
      <div class="develop-stack">
        <img class="duo" alt="">
        <img class="color" alt="">
      </div>
      <figcaption class="detail-thumbs"></figcaption>
    </figure>
    <aside class="detail-info">
      <dl>
        <div><dt>ID</dt><dd data-f="id"></dd></div>
        <div><dt>TITLE / 词条</dt><dd data-f="title"></dd></div>
        <div><dt>SOURCE / 出处</dt><dd data-f="source"></dd></div>
        <div><dt>YEAR / 年代</dt><dd data-f="year"></dd></div>
        <div><dt>TAGS / 标签</dt><dd data-f="tags"></dd></div>
        <div><dt>DESCRIPTION / 备注</dt><dd data-f="description"></dd></div>
      </dl>
    </aside>
  </div>
  <button id="detailBack" type="button">↓ BACK / 返回</button>
</div>

<script src="data/database.js"></script>
<script src="js/app.js"></script>
<script src="js/filterbar.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/imagewall.js"></script>
<script src="js/detail.js"></script>
<script>DR.init();</script>
</body>
</html>
